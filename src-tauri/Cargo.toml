[package]
name = "intuicode"
version = "0.3.0"
description = "Write and read code in plain sentences"
authors = ["IntuCode"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "intuicode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
