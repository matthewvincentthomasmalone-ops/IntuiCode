name: Desktop app

# Builds IntuaCode installers for Windows, macOS and Linux, from the version in src-tauri/tauri.conf.json.
# Run it from the Actions tab ("Run workflow") on main, or push a tag like v0.4.0.
# The installers are attached to a draft GitHub Release for that version, with SHA256SUMS.txt and a
# provenance attestation each. A draft is private (only the repository's owner sees it) until it's published
# by hand. Each installer carries LICENSE (Business Source License 1.1) and THIRD-PARTY-NOTICES.md. (The public website is offline for now, so it isn't rebuilt: see pages.yml.)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Code signing turns on by itself once its secrets are in the repository (see SECURITY.md); without them the
      # installers are built unsigned, as before.
      WINDOWS_SIGNING: ${{ secrets.ESIGNER_CREDENTIAL_ID != '' }}
      MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      RELEASE_BODY: |
        Installers for IntuaCode.
        - Windows: the -setup.exe file (or the .msi for managed PCs)
        - Linux: the .AppImage (run it directly), the .deb (Ubuntu, Debian, Mint) or the .rpm (Fedora, openSUSE)
        - macOS: the .dmg file (works on Apple Silicon and Intel)

        **Check a download:** SHA256SUMS.txt lists every file's SHA-256 (`sha256sum -c SHA256SUMS.txt --ignore-missing`, or `Get-FileHash` in PowerShell). Each installer also has a signed record of the GitHub build that made it from this source: `gh attestation verify <file> --repo ${{ github.repository }}`.

        Code signing: see SECURITY.md in the repository. If Windows or macOS warns the first time an installer is opened, check the checksum or the attestation first. See the README for how to open them.
        A 15-minute checklist for trying it out is in TESTING.md.
        C++ on Windows uses Visual Studio's compiler (the free Build Tools are enough); Arduino uses the arduino-cli inside the Arduino IDE 2.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linux build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable   # pinned to a commit, the action can't take this from its tag
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Bundle Python and the parsers (so the app works offline)
        run: |
          npm ci
          npm run vendor
          python tools/fetch_pyodide.py

      # Windows signing: Tauri signs the app, its uninstaller and both installers with tools/sign-windows.ps1,
      # which uses Jsign and SSL.com's eSigner cloud signing. Jsign is checked against its SHA-256 before use.
      - name: Set up Windows code signing
        if: matrix.platform == 'windows-latest' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'jsign-7.6.jar'
          Invoke-WebRequest 'https://repo1.maven.org/maven2/net/jsign/jsign/7.6/jsign-7.6.jar' -OutFile $jar
          $hash = (Get-FileHash $jar -Algorithm SHA256).Hash
          if ($hash -ne '6CF58AA080E7FF82656F320CFF8D4A3BFF30408DF8766806DCBA3740DD839FA5') { throw "jsign-7.6.jar isn't the expected file (SHA-256 $hash)" }
          $script = Join-Path $env:GITHUB_WORKSPACE 'tools\sign-windows.ps1'
          $conf = Join-Path $env:RUNNER_TEMP 'sign-windows.json'
          @{ bundle = @{ windows = @{ signCommand = @{ cmd = 'pwsh'; args = @('-NoProfile', '-NonInteractive', '-File', $script, '%1') } } } } |
            ConvertTo-Json -Depth 6 | Set-Content -Path $conf -Encoding utf8
          Get-Content $conf
          Add-Content -Path $env:GITHUB_ENV -Value "JSIGN_JAR=$jar"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGN_ARGS=--config $conf"

      # macOS signing and notarisation: Tauri does both when these are set (it imports the certificate into a
      # keychain of its own). They're only set when the secrets exist: Tauri treats an empty one as set.
      - name: Set up macOS code signing and notarisation
        if: matrix.platform == 'macos-latest' && env.MACOS_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is missing: macOS signing needs all six (see SECURITY.md)"; exit 1; fi
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done

      # Bundling downloads its tools from GitHub (NSIS and WiX on Windows, AppImage's helpers on Linux), which
      # now and then answers 504: if this fails, the step below tries once more, a minute later.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: bundle
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_ENDPOINT: ${{ vars.ESIGNER_ENDPOINT }}
        with:
          tagName: v__VERSION__
          releaseName: "IntuaCode v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true   # private until published by hand on GitHub (Releases → Edit → Publish)
          prerelease: true
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}

      - name: Wait a minute before trying again
        if: steps.bundle.outcome == 'failure'
        shell: bash
        run: sleep 60

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        if: steps.bundle.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          ESIGNER_ENDPOINT: ${{ vars.ESIGNER_ENDPOINT }}
        with:
          tagName: v__VERSION__
          releaseName: "IntuaCode v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true   # private until published by hand on GitHub (Releases → Edit → Publish)
          prerelease: true
          args: ${{ matrix.args }} ${{ env.SIGN_ARGS }}

      # When signing is on, a file that isn't properly signed stops the release here, before its checksums and
      # attestations are made and before the website offers it.
      - name: Check the Windows signatures
        if: matrix.platform == 'windows-latest' && env.WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem 'src-tauri/target/release/intuicode.exe', 'src-tauri/target/release/bundle/nsis/*-setup.exe', 'src-tauri/target/release/bundle/msi/*.msi'
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($s.Status), $($s.SignerCertificate.Subject), timestamped by $($s.TimeStamperCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) isn't properly signed: $($s.StatusMessage)" }
            if (-not $s.TimeStamperCertificate) { throw "$($f.Name) has no timestamp, so its signature would stop working when the certificate expires" }
          }
          "### Windows: signed by $($s.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY

      - name: Check the macOS signature and notarisation
        if: matrix.platform == 'macos-latest' && env.MACOS_SIGNING == 'true'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/IntuaCode.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"   # passes only for a notarised Developer ID app
          xcrun stapler validate "$app"
          echo "### macOS: signed and notarised ($(codesign -dv "$app" 2>&1 | grep '^Authority=' | head -1))" >> "$GITHUB_STEP_SUMMARY"

  # Once every installer is attached (signed, where signing is set up): their checksums and a signed provenance
  # record for each (built here, from this commit).
  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # SHA256SUMS.txt on the release
      id-token: write        # the attestations are signed with this workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir installers --pattern '*.exe' --pattern '*.msi' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' --pattern '*.dmg' --pattern '*.tar.gz'
          ls -l installers

      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd installers && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          { echo "### $TAG checksums"; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installers/*
