name: Desktop app

# Builds IntuCode installers for Windows, macOS and Linux.
# Run it from the Actions tab ("Run workflow"), or push a tag like v0.1.0.
# The installers are attached to a GitHub Release (pre-release) for that version.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linux build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable   # pinned to a commit, the action can't take this from its tag
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Bundle Python and the parsers (so the app works offline)
        run: |
          npm ci
          npm run vendor
          python tools/fetch_pyodide.py

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "IntuCode v__VERSION__"
          releaseBody: |
            Installers for IntuCode.
            - Windows: the .msi or -setup.exe file
            - macOS: the .dmg file (works on Apple Silicon and Intel)
            - Linux: the .AppImage (run it directly) or the .deb (Ubuntu/Debian)
            These builds aren't signed yet, so Windows and macOS will warn you the first time. See the README for how to open them.
            A 15-minute checklist for trying it out is in TESTING.md.
            C++ on Windows uses Visual Studio's compiler (the free Build Tools are enough); Arduino uses the arduino-cli inside the Arduino IDE 2.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
