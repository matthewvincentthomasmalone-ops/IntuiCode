name: Desktop app

# Builds IntuaCode installers for Windows, macOS and Linux, from the version in src-tauri/tauri.conf.json.
# Run it from the Actions tab ("Run workflow") on main, or push a tag like v0.4.0.
# The installers are attached to a GitHub Release (pre-release) for that version, with SHA256SUMS.txt and
# a provenance attestation each; then the website is rebuilt, so intuacode.com offers them.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE_BODY: |
        Installers for IntuaCode (also at https://intuacode.com).
        - Windows: the -setup.exe file (or the .msi for managed PCs)
        - Linux: the .AppImage (run it directly), the .deb (Ubuntu, Debian, Mint) or the .rpm (Fedora, openSUSE)
        - macOS: the .dmg file (works on Apple Silicon and Intel)

        **Check a download:** SHA256SUMS.txt lists every file's SHA-256 (`sha256sum -c SHA256SUMS.txt --ignore-missing`, or `Get-FileHash` in PowerShell). Each installer also has a signed record of the GitHub build that made it from this source: `gh attestation verify <file> --repo ${{ github.repository }}`.

        These installers aren't code-signed yet (code signing policy: https://intuacode.com/code-signing.html), so Windows and macOS warn the first time they're opened: check the checksum or the attestation first. See the README for how to open them.
        A 15-minute checklist for trying it out is in TESTING.md.
        C++ on Windows uses Visual Studio's compiler (the free Build Tools are enough); Arduino uses the arduino-cli inside the Arduino IDE 2.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Linux build tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable   # pinned to a commit, the action can't take this from its tag
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Bundle Python and the parsers (so the app works offline)
        run: |
          npm ci
          npm run vendor
          python tools/fetch_pyodide.py

      # Bundling downloads its tools from GitHub (NSIS and WiX on Windows, AppImage's helpers on Linux), which
      # now and then answers 504: if this fails, the step below tries once more, a minute later.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: bundle
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "IntuaCode v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      - name: Wait a minute before trying again
        if: steps.bundle.outcome == 'failure'
        shell: bash
        run: sleep 60

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        if: steps.bundle.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "IntuaCode v__VERSION__"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}

      # SignPath signs only what this workflow run built (it checks): the Windows installers, kept as an artifact
      - name: Keep the Windows installers for signing
        if: matrix.platform == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Windows code signing through a SignPath.io plan (see SECURITY.md). Off until the
  # project is set up there: repository variable SIGNPATH_ORGANIZATION_ID and secret SIGNPATH_API_TOKEN
  # (SIGNPATH_PROJECT_SLUG and SIGNPATH_POLICY_SLUG if they aren't intuacode and release-signing). Each request
  # waits for an approver to approve it in SignPath, then the signed installers replace the unsigned ones.
  sign-windows:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write        # the signed installers on the release
      actions: read          # the run's artifacts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Find the unsigned installers
        id: unsigned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "TAG=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_ENV"
          echo "artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "windows-unsigned") | .id')" >> "$GITHUB_OUTPUT"

      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'intuacode' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400   # four hours for an approver to approve it
          output-artifact-directory: signed

      - name: Put the signed installers on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l signed
          gh release upload "$TAG" signed/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "### $TAG: Windows installers signed through SignPath" >> "$GITHUB_STEP_SUMMARY"

  # Once every installer is attached (and the Windows ones signed, if that's set up): their checksums, a signed
  # provenance record for each (built here, from this commit), and the website rebuilt so the home page's
  # buttons give the new version.
  checksums:
    needs: [build, sign-windows]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # SHA256SUMS.txt on the release
      id-token: write        # the attestations are signed with this workflow's identity
      attestations: write
      actions: write         # starts the Website workflow
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --dir installers --pattern '*.exe' --pattern '*.msi' --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm' --pattern '*.dmg' --pattern '*.tar.gz'
          ls -l installers

      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd installers && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          { echo "### $TAG checksums"; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: installers/*

      - name: Rebuild the website (its download buttons)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
