name: Website

# The public website is offline while IntuaCode becomes a paid product (since 2026-11-10): GitHub Pages is
# turned off, and this workflow only builds the site (pull requests, and Run workflow) to check it still builds.
# To run it locally: npm run site (http://127.0.0.1:8080). To publish it again under the product's final domain:
# Settings -> Pages -> Source: GitHub Actions, set the custom domain, then Actions -> Website -> Run workflow
# with "publish" ticked.
#   /      the home page (site/)
#   /app/  the browser version: the same dist/ folder the desktop app ships (tools/build_desktop.mjs),
#          with Python (pyodide/), the code-reading parsers (vendor/) and the fonts bundled, so nothing
#          loads from another site
# tools/build_site.mjs puts them together, with downloads.json and .well-known/security.txt.
# The custom domain is set in Settings -> Pages, not here (a CNAME file is ignored
# when a workflow publishes the site). Pull requests build the site but don't publish it.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to GitHub Pages (turn Pages on first)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Bundle Python and the parsers
        run: |
          npm ci
          npm run vendor
          python tools/fetch_pyodide.py

      - name: Assemble the site
        # "false" makes the script stop if pyodide/ or vendor/ is missing, as for a release.
        env:
          TAURI_ENV_DEBUG: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # to read the newest release, for the download buttons
        run: |
          node tools/build_desktop.mjs
          node tools/build_site.mjs
          echo "### Site" >> "$GITHUB_STEP_SUMMARY"
          echo "$(du -sh _site | cut -f1), $(find _site -type f | wc -l) files, largest: $(find _site -type f -printf '%s %p\n' | sort -n | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Downloads: $(node -p "const d=require('./_site/downloads.json'); (d.tag||'none') + ', ' + d.files.length + ' installers'")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # .well-known/security.txt

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
