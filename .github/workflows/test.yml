name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install tree-sitter (for the web reader tests)
        run: npm ci
      - name: Reader tests (Python)
        run: python3 -m unittest discover -s tests -v
      - name: Translator, blueprint and round-trip tests (Node)
        run: node --test tests/*.test.mjs
      - name: How much reads as sentences
        run: |
          echo '### Corpus' >> "$GITHUB_STEP_SUMMARY"
          node tools/coverage.mjs samples tests/corpus | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### Held-out' >> "$GITHUB_STEP_SUMMARY"
          node tools/coverage.mjs tests/heldout | tee -a "$GITHUB_STEP_SUMMARY"
