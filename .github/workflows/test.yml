name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install tree-sitter (for the web reader tests)
        run: npm ci
      - name: Reader tests (Python)
        run: python3 -m unittest discover -s tests -v
      - name: Translator, blueprint and round-trip tests (Node)
        run: node --test tests/*.test.mjs
      - name: How much reads as sentences
        run: |
          echo '### Corpus' >> "$GITHUB_STEP_SUMMARY"
          node tools/coverage.mjs samples tests/corpus | tee -a "$GITHUB_STEP_SUMMARY"
          echo '### Held-out' >> "$GITHUB_STEP_SUMMARY"
          node tools/coverage.mjs tests/heldout | tee -a "$GITHUB_STEP_SUMMARY"
