name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reader tests (Python)
        run: python3 -m unittest discover -s tests -v
      - name: Translator, blueprint and round-trip tests (Node)
        run: node --test tests/*.test.mjs
      - name: How much reads as sentences
        run: node tools/coverage.mjs samples tests/corpus | tee -a "$GITHUB_STEP_SUMMARY"
