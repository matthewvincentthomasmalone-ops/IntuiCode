<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brightside Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top navigation -->
  <nav class="nav">
    <a href="#menu" class="nav-link">Menu</a>
    <a href="#visit" class="nav-link">Visit us</a>
  </nav>

  <header id="hero" class="hero">
    <h1>Fresh bread, every morning</h1>
    <p class="tagline">Baked in small batches since 1998.</p>
    <button id="order" class="cta">Order ahead</button>
  </header>

  <main>
    <section id="menu">
      <h2>Today's menu</h2>
      <ul id="menu-list">
        <li>Sourdough</li>
        <li>Rye &amp; caraway</li>
        <li>Cinnamon buns</li>
      </ul>
    </section>

    <section id="visit">
      <h2>Visit us</h2>
      <p>12 Harbour Street &mdash; open <strong>7am to 3pm</strong>.</p>
      <img src="shop.jpg" alt="The shop front">
    </section>

    <form id="signup">
      <label for="email">Get our weekly specials</label>
      <input type="email" id="email" placeholder="you@example.com">
      <button type="submit">Sign me up</button>
    </form>
    <p id="thanks" hidden>Thanks! See you soon.</p>
  </main>

  <footer>
    <p>&copy; 2026 Brightside Bakery</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
