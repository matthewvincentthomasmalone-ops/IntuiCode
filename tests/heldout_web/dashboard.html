<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sales dashboard</title>
<style>
  body { font-family: system-ui; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark">
<h1>Sales</h1>
<table id="sales">
  <thead><tr><th>Month</th><th>Total</th></tr></thead>
  <tbody>
    <tr><td>Jan</td><td>1,200</td></tr>
  </tbody>
</table>
<form id="filter" action="/search" method="get">
  <label>From <input type="date" name="from"></label>
  <select id="region"><option value="n">North</option><option value="s">South</option></select>
  <textarea id="notes" rows="3"></textarea>
  <input type="checkbox" id="live" checked>
  <button>Apply</button>
</form>
<div id="chart" style="height: 300px"></div>
<canvas id="c" width="400" height="200"></canvas>
<svg width="20" height="20"><circle cx="10" cy="10" r="8" fill="red"/></svg>
<ol>
  <li><a href="/a">A</a></li>
  <li>Plain</li>
</ol>
<script type="module" src="main.js"></script>
</body>
</html>
